spring.application.name=calculator
server.port=${SERVER_PORT:8080}

# Write BigDecimal results as plain numbers (10, not 1E+1)
spring.jackson.generator.write-bigdecimal-as-plain=true

# Actuator: expose only the health endpoint (used by Docker / Compose health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=calculator
info.app.version=${APP_VERSION:dev}
