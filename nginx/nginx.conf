# Reverse proxy / load balancer in front of the calculator replicas.
# This file is included inside the http {} block of the stock nginx.conf.

# Docker's embedded DNS. With "resolve" below, Nginx re-resolves the service name
# periodically, so it finds every replica and follows containers recreated with new IPs.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream calculator_backend {
    zone calculator_backend 64k;
    server calculator:8080 resolve max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    # Liveness of the proxy itself (used by the Compose health check)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://calculator_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_next_upstream   error timeout http_502 http_503;

        # Shows which replica served the request (handy for demonstrating load balancing)
        add_header X-Upstream-Server $upstream_addr always;
    }
}
