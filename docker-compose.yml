# Full stack: 2 calculator replicas behind an Nginx reverse proxy.
#   docker compose up -d        -> http://localhost:${HOST_PORT:-8081}
# Defaults for the variables below live in .env; Jenkins overrides IMAGE_TAG per build.
name: calculator

services:
  calculator:
    image: ${DOCKER_IMAGE:-vortexfrenzy/calculator-devops}:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        APP_VERSION: ${IMAGE_TAG:-latest}
    deploy:
      replicas: ${APP_REPLICAS:-2}
    environment:
      SERVER_PORT: "8080"
      APP_VERSION: ${IMAGE_TAG:-latest}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - backend

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${HOST_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - frontend
      - backend

networks:
  # Public-facing network: only Nginx is attached and publishes a host port
  frontend:
  # Private network: the API replicas are not reachable from outside the stack
  backend:
    internal: true
